<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">Strix Halo benchmark results</title>
<desc id="desc">Four vertical bar charts compare Taranis, Halogen, Strata, strix-llama.cpp Vulkan and stock llama.cpp. Taranis was measured on 2026-11-02; other engines on 2026-10-31. All axes start at zero.</desc>
<style>:root { --panel-top: #ffffff; --panel-bottom: #f6f9fd; --border: #dce5f0; --text: #23344b; --muted: #596c84; --grid: #e4ebf4; --baseline: #bac9dc; --accent-top: #0ea5e9; --accent-bottom: #2563eb; --accent-text: #0369a1; --bar-top: #8ca0ba; --bar-bottom: #738ba8; }
@media (prefers-color-scheme: dark) { :root { --panel-top: #162133; --panel-bottom: #111b2b; --border: #2b3d56; --text: #e6eefb; --muted: #a4b5cd; --grid: #293950; --baseline: #526984; --accent-top: #67e8f9; --accent-bottom: #3b82f6; --accent-text: #7dd3fc; --bar-top: #7b94b3; --bar-bottom: #56718f; } }
text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); }
.heading { font-size: 22px; font-weight: 650; letter-spacing: -.3px; }
.caption { font-size: 12px; fill: var(--muted); }
.tick { font-size: 11px; fill: var(--muted); }
.value { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.engine { font-size: 13.5px; font-weight: 500; }
.highlight { fill: var(--accent-text); font-weight: 750; }
.versions { font-size: 11.5px; fill: var(--muted); }
.panel { fill: url(#panel); stroke: var(--border); }
.grid { stroke: var(--grid); }
.baseline { stroke: var(--baseline); }</style>
<defs>
<linearGradient id="panel" x2="0" y2="1"><stop style="stop-color:var(--panel-top)"/><stop offset="1" style="stop-color:var(--panel-bottom)"/></linearGradient>
<linearGradient id="accent" x2="0" y2="1"><stop style="stop-color:var(--accent-top)"/><stop offset="1" style="stop-color:var(--accent-bottom)"/></linearGradient>
<linearGradient id="other" x2="0" y2="1"><stop style="stop-color:var(--bar-top)"/><stop offset="1" style="stop-color:var(--bar-bottom)"/></linearGradient>
</defs>
